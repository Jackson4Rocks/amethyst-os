# Calypso Linux — Aurora Dotfiles dynamic theming

[config]
reload_apps = true
caching = true

[templates.shell]
input_path = '~/.config/matugen/templates/aurora-theme.qml'
output_path = '~/.config/quickshell/aurora/Theme.qml'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/aurora-colors.conf'

[templates.fuzzel]
input_path = '~/.config/matugen/templates/fuzzel-colors.ini'
output_path = '~/.config/fuzzel/fuzzel.ini'

[config.wallpaper]
set = false
