insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

if loadfont "${prefix}/fonts/unicode.pf2"; then
    insmod all_video
    insmod gfxmenu
    insmod png
    set gfxmode="auto"
    terminal_input console
    terminal_output console
    background_image "$prefix/amethyst-background.png"
    set color_normal=light-gray/black
    set color_highlight=white/purple
fi

default=amethyst
timeout=7
timeout_style=menu

menuentry "Start Amethyst OS AURORA" --class amethyst --class gnu-linux --class gnu --class os --id 'amethyst' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Start Amethyst OS AURORA (Accessibility)" --class amethyst --class gnu-linux --class gnu --class os --id 'amethyst-accessibility' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == 'efi' ]; then
    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'Reboot' --class reboot {
    reboot
}

menuentry 'Power Off' --class shutdown {
    halt
}
