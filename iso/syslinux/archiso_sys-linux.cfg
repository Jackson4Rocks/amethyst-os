LABEL arch
TEXT HELP
Boot the Calypso Linux live medium on BIOS.
It allows you to install Calypso Linux or perform system maintenance.
ENDTEXT
MENU LABEL Calypso Linux live medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=no

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the Calypso Linux live medium on BIOS with speakup screen reader.
It allows installation or system maintenance with speech feedback.
ENDTEXT
MENU LABEL Calypso Linux live medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on copytoram=no
