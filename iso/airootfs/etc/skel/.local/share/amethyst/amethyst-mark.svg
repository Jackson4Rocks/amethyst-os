<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Amethyst OS logo</title>
  <desc id="desc">A faceted geometric A monogram used as the single Amethyst OS brand mark.</desc>
  <defs>
    <linearGradient id="amethyst" x1="94" y1="72" x2="420" y2="444" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5eaff"/>
      <stop offset="0.24" stop-color="#d8b4fe"/>
      <stop offset="0.58" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="facet" x1="256" y1="112" x2="256" y2="386" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="0.46" stop-color="#d8b4fe" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0.88"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <path
      d="M256 48 L449 428 H358 L315 342 H197 L154 428 H63 Z
         M256 139 L224 269 H288 Z"
      fill="url(#amethyst)"
      fill-rule="evenodd"
    />
    <path d="M256 139 L224 269 L256 351 L288 269 Z" fill="url(#facet)"/>
    <path d="M224 269 L256 351 L256 282 Z" fill="#8b5cf6" fill-opacity="0.72"/>
    <path d="M288 269 L256 351 L256 282 Z" fill="#f3e8ff" fill-opacity="0.76"/>
  </g>

  <path d="M256 64 L434 416" stroke="#ffffff" stroke-opacity="0.26" stroke-width="3"/>
  <path d="M256 64 L78 416" stroke="#c4b5fd" stroke-opacity="0.18" stroke-width="3"/>
</svg>
