<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Calypso Linux mark</title>
  <desc id="desc">A faceted emerald crystal C inside a luminous circular halo.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="68%">
      <stop offset="0" stop-color="#063b29"/>
      <stop offset=".55" stop-color="#02150e"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="crystal" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0" stop-color="#d9fff0"/>
      <stop offset=".18" stop-color="#55ffc0"/>
      <stop offset=".5" stop-color="#10e89a"/>
      <stop offset=".78" stop-color="#079568"/>
      <stop offset="1" stop-color="#003d2a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9effd8"/>
      <stop offset=".5" stop-color="#18f4a2"/>
      <stop offset="1" stop-color="#087b56"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="b"/>
