<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Calypso Linux</title>
  <desc id="desc">The original Calypso Linux angular pink C mark with three spark points.</desc>
  <defs>
    <linearGradient id="pink" x1="12%" y1="18%" x2="88%" y2="82%">
      <stop offset="0" stop-color="#ffd5f5"/>
      <stop offset="0.42" stop-color="#ff9ee9"/>
      <stop offset="0.72" stop-color="#f178d7"/>
      <stop offset="1" stop-color="#d34fba"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)" fill="url(#pink)">
    <!-- Angular C silhouette reconstructed from the original Calypso mark. -->
    <path d="M322 118H242L184 144L146 188L132 256L146 324L184 368L242 394H322L286 324H246L218 308L200 282L194 256L200 230L218 204L246 188H286Z"/>
    <circle cx="350" cy="187" r="9"/>
    <circle cx="378" cy="228" r="15"/>
    <circle cx="409" cy="274" r="22"/>
  </g>
</svg>