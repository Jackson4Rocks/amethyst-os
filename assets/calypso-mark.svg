  <circle cx="256" cy="256" r="158" fill="none" stroke="#18e99c" stroke-opacity=".08"/>
  <circle cx="256" cy="256" r="120" fill="#10e89a" opacity=".09" filter="url(#soft)"/>
  <g filter="url(#glow)">
