<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Calypso Linux</title>
  <desc id="desc">Crystalline emerald Calypso C logo with orbital ring and four-point stars.</desc>
  <defs>
    <linearGradient id="crystal" x1="18%" y1="12%" x2="82%" y2="88%">
      <stop offset="0" stop-color="#ecfff8"/>
      <stop offset=".22" stop-color="#8fffd0"/>
      <stop offset=".48" stop-color="#17e79d"/>
      <stop offset=".78" stop-color="#08a875"/>
      <stop offset="1" stop-color="#033c2b"/>
    </linearGradient>
    <linearGradient id="crystal2" x1="90%" y1="0%" x2="0%" y2="100%">
      <stop offset="0" stop-color="#d4fff0"/>
      <stop offset=".35" stop-color="#36ffb2"/>
      <stop offset="1" stop-color="#075a40"/>
    </linearGradient>
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#f1fff9"/>
      <stop offset=".4" stop-color="#79ffd0"/>
      <stop offset="1" stop-color="#0b9d6b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#18f4a6" stop-opacity=".32"/>
      <stop offset=".55" stop-color="#18f4a6" stop-opacity=".10"/>
      <stop offset="1" stop-color="#18f4a6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tinyGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="crystalSoft" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur stdDeviation=".45"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="209" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="205" fill="none" stroke="#13e99d" stroke-opacity=".72" stroke-width="2" filter="url(#tinyGlow)"/>

  <g fill="#caffea" filter="url(#softGlow)">
    <path d="M256 30 266 65 256 91 246 65Z"/>
    <path d="M256 421 266 455 256 486 246 455Z"/>
    <path d="M30 256 65 246 91 256 65 266Z"/>
    <path d="M482 256 447 266 421 256 447 246Z"/>
    <path d="M256 230 269 256 256 282 243 256Z"/>
  </g>

  <!-- Main angular C silhouette -->
  <path
    d="M352 105
       L288 105 L232 125 L183 160 L153 205
       L143 256 L153 307 L183 352 L232 387
       L288 407 L352 407 L318 337
       L273 337 L236 319 L212 292 L203 256
       L212 220 L236 193 L273 175 L318 175 Z"
    fill="url(#crystal)"
    stroke="url(#edge)"
    stroke-width="2.5"
    stroke-linejoin="round"/>

  <!-- top crystal wing -->
  <g stroke="#9dffe0" stroke-opacity=".60" stroke-width="1.25" stroke-linejoin="round">
    <polygon points="288,105 326,125 365,151 340,174 312,175 273,175"/>
    <polygon points="326,125 366,169 411,174 365,151"/>
    <polygon points="366,169 411,174 377,198 340,174"/>
    <polygon points="365,151 411,174 380,189 340,174"/>
    <polygon points="288,105 273,175 312,175 326,125" fill="url(#crystal2)"/>
  </g>

  <!-- left vertical facets -->
  <g stroke="#5effc5" stroke-opacity=".45" stroke-width="1.25">
    <polygon points="232,125 288,105 273,175 236,193 183,160"/>
    <polygon points="183,160 236,193 212,220 153,205"/>
    <polygon points="153,205 212,220 203,256 143,256"/>
    <polygon points="143,256 203,256 212,292 153,307"/>
    <polygon points="153,307 212,292 236,319 183,352"/>
  </g>

  <!-- inner facets -->
  <g stroke="#baffea" stroke-opacity=".34" stroke-width="1.1">
    <polygon points="236,193 273,175 252,210 212,220" fill="#0b7553"/>
    <polygon points="252,210 273,175 318,175 278,220" fill="#12b780"/>
    <polygon points="212,220 252,210 278,220 203,256" fill="#063c2d"/>
    <polygon points="203,256 278,220 281,286 212,292" fill="#07563f"/>
    <polygon points="212,292 281,286 273,337 236,319" fill="#10b87d"/>
  </g>

  <!-- lower crystal wing -->
  <g stroke="#9dffe0" stroke-opacity=".72" stroke-width="1.4" stroke-linejoin="round">
    <polygon points="183,352 236,319 273,337 312,337 330,407 288,407 232,387"/>
    <polygon points="288,407 330,407 390,375 417,373 388,341 337,370"/>
    <polygon points="337,370 388,341 412,364 390,375"/>
    <polygon points="312,337 337,370 330,407 273,337" fill="url(#crystal2)"/>
  </g>

  <g fill="none" stroke="#eafff8" stroke-opacity=".78" stroke-width="2" stroke-linecap="round">
    <path d="M366 169 411 174"/>
    <path d="M388 341 417 373"/>
    <path d="M153 205 212 220"/>
    <path d="M153 307 212 292"/>
  </g>

  <g fill="#27ffb0" opacity=".95" filter="url(#tinyGlow)">
    <circle cx="204" cy="205" r="2"/>
    <circle cx="329" cy="138" r="2"/>
    <circle cx="330" cy="381" r="2"/>
    <circle cx="200" cy="311" r="2"/>
  </g>
</svg>